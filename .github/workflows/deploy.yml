name: CI/CD Pipeline

on:
  push:
    branches: [main, master, homework_35.2]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root
      - name: Run tests
        run: poetry run pytest --cov=. --cov-fail-under=80
      - name: Run flake8
        run: poetry run flake8 --exclude=migrations --max-line-length=119

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homework_35.2'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/homeworkdrf
            git pull origin ${{ github.ref_name }}
            docker compose down
            docker compose up -d --build
            docker compose exec web python manage.py migrate
            docker system prune -f
