name: CI/CD Pipeline

on:
  push:
    branches: [main, master, finaltask]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "django-insecure-jsfbaa-lkspa-frt-o1r-p88pnk-wxqrmn-tm6-7"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      NAME: "courswork5"
      USER: "postgres"
      PASSWORD: "1234567890"
      HOST: "localhost"
      PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root
      - name: Run migrations
        run: poetry run python manage.py migrate
      - name: Run tests
        run: poetry run python manage.py test
      - name: Run flake8
        run: poetry run flake8 --exclude=migrations --max-line-length=119

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/finaltask'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/coursework_5
            git pull origin finaltask
            docker compose down
            docker compose up -d --build
            docker compose exec web python manage.py migrate
            docker system prune -f
