[project]
name = "coursework-5"
version = "0.1.0"
description = "Habit Tracker Backend API"
authors = [{name = "Anton"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.17.1,<4.0.0",
    "django-filter>=25.2,<26.0",
    "django-celery-beat>=2.9.0,<3.0.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "celery>=5.6.3,<6.0.0",
    "redis>=7.4.0,<8.0.0",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "drf-yasg>=1.21.15,<2.0.0",
    "requests>=2.33.1,<3.0.0",
    "stripe>=15.0.1,<16.0.0",
    "eventlet>=0.41.0,<0.42.0",
    "coverage>=7.13.5,<8.0.0",
    "pillow>=12.1.1,<13.0.0",
    "djangorestframework-simplejwt>=5.5.1,<6.0.0",
]

[dependency-groups]
lint = [
    "flake8>=7.3.0,<8.0.0",
    "black>=26.3.1,<27.0.0",
    "mypy>=1.20.2,<2.0.0",
    "isort>=8.0.1,<9.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.black]
line-length = 119
target-version = ['py312']
extend-exclude = 'migrations'

[tool.isort]
profile = "black"
line_length = 119
skip = ["migrations"]

[tool.flake8]
max-line-length = 119
exclude = ["migrations", "__pycache__", ".venv"]
ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations"]
